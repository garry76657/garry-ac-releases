; Marketplace categories, read by the App Hub (from the version after v0.11).
; A category listed here gets its label, colour, icon and filter chip in the
; Hub even if that Hub was released before the category existed.
;
; [type_key]       the TYPE value listings use
; LABEL            the pill on a listing
; FILTER_LABEL     the filter chip in the Marketplace tab
; COLOR            #RRGGBB
; GLYPH            icon name, the file is marketplace/glyphs/pill-<GLYPH>-64.png
;                  (add a new PNG there and the Hub downloads it)
; MIN_HUB          optional, hide this category from Hubs older than this

[hud_widget]
LABEL = HUD Widget
FILTER_LABEL = HUD Widgets
COLOR = #FF4A96
GLYPH = layout

[photo_shot]
LABEL = Photo Shot
FILTER_LABEL = Photo Shots
COLOR = #FFD000
GLYPH = aperture

; The filter chips after All, in order. A Hub from v0.12 on shows exactly
; these; add, remove or move a key here and every Hub follows. A category
; with a section above but not in this list keeps its pill style on listings
; and gets no chip.
[_CHIPS]
ORDER = chaser_script, cockpit_script, ppfilter, skydome_pack, spice_effect, shader
