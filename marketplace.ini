DESCRIPTION=## What's new in V1.02\n\nGarry's Customisable DynaCam V1.02 moves every control directly into the Chaser Cam app, which means the UI can now be more advanced and isnt stuck in the Pure Config shaders tab anymore.\n\n{img:image1.jpg}\n\n## What's changed\n\n{img:speedshakegearjolt.jpg}\n\nThe old X/Y/Z amount, time, and goal sliders have been simplified into a much cleaner Speed Shake section: Shake Intensity, Shake Speed Start, and Shake Speed Full. Shake Factor and Speed Shake Offset have also been removed.\n\n### Layout\n\nAll other controls are now organised into four collapsible sections — FOV, Spring Physics, Speed Shake, and Gear Shift Jolt — so you only see the controls you're actively tuning.\n\n## What's new\n\n• Quick Presets — built-in loadouts that swap the entire configuration in one click.\n• Gear Shift Jolt — adds a subtle camera jolt on each gear change, with adjustable intensity.\n\n-# Compatible with all chaser-camera scripts.
