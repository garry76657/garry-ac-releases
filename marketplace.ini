NAME=Garry's Customisable DynaCam
TYPE=chaser_script
AUTHOR=Garry Roberts
SHORT_DESC=A customisable version of kirbyguy22's dynacam.
DESCRIPTION={img:speedshakegearjolt.jpg}\n\n## What's changed?\n\nThe old X/Y/Z amount, time, and goal sliders have been simplified into a much cleaner Speed Shake section which consists of Shake Intensity, Shake Speed Start, and Shake Speed Full. Shake Factor and Speed Shake Offset have also been removed.\n\n\n{img:image1.jpg}\n\nAll other controls are now organised into four collapsible sections, those being FOV, Spring Physics, Speed Shake, and Gear Shift Jolt so you only see the controls you're actively tuning.\n\n## What's new?\n\n• Quick Presets: Built-in presets that instantly let you swap the cameras UI configuration.\n• Gear Shift Jolt: A subtle camera jolt on each gear change, with adjustable intensity.
VERSION=1.03
THUMBNAIL=garrydynacam.webp
KEYWORDS=chase,dynamic,flow,cinematic,speed,distance,fov,kirbyguy22
APPS=ChaserCam
TIER=garryfree
PREVIEW_IMAGES=garrydynacam.webp,image1.jpg
