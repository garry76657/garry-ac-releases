; Garry's setups, read by the App Hub's Setups tab.
; One press sets several apps at once. Add or change a setup here and push;
; no app update needed.
;
; [Setup_N]        numbered from 1, no gaps, the list stops at the first gap
; ID               stable key, never change it once published
; NAME             what people read
; DESCRIPTION      one or two plain lines
; CATEGORY         driving | replay
; AUTHOR           shown on the setup's page
; VERSION          bump it when you change any preset file below, so the Hub
;                  re-downloads them for people who already have them
; PREVIEW          16 by 9 picture, path under setups/
; TARGET_n         App | preset name | required content | how
;                  App: PPFilter Skydome NeckFx ChaserCam CarCustomiser
;                  how (PPFilter only): empty replaces the look, add goes on
;                  top of it, full=<preset> offers both
; TARGET_n_FILE    the preset file the Hub installs, path under setups/
; TARGET_n_FILE_LCS / TARGET_n_FILE_GAMMA   PPFilter, one per Pure flavour

[Setup_1]
ID = garry_dashcam
NAME = Garry's Dashcam
DESCRIPTION = Turns your drive into dashcam footage. The Dashcam camera in NeckFx, plus the Dashcam spice and glare on top of your own GarryReal look.
CATEGORY = driving
AUTHOR = Garry Roberts
VERSION = 1.0
PREVIEW = garry_dashcam/preview.jpg
TARGET_0 = PPFilter | Garry's Dashcam | GarryReal | add
TARGET_0_FILE_LCS = garry_dashcam/PPFilter lcs/Garry's Dashcam.ini
TARGET_0_FILE_GAMMA = garry_dashcam/PPFilter gamma/Garry's Dashcam.ini
TARGET_1 = NeckFx | Garry's Dashcam
TARGET_1_FILE = garry_dashcam/NeckFx/Garry's Dashcam.ini
