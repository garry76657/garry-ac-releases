[Mod_3]
NAME=Garry's Head Cam
TYPE=cockpit_script
AUTHOR=Garry Roberts
SHORT_DESC=My own take on a cockpit camera, with per-car auto tuning, corner gaze and car tracking.
DESCRIPTION=## V1.01 Update\n\nV1.01 is mainly so the Head Cam works with the new V0.12 NeckFx App. All of the settings are now in CM's script settings, so they show up in the NeckFx App's Scripts tab and in CM, and any presets you saved before still work.\n\nAlong with that, car tracking can now look through a gap in traffic when there's room for your car, instead of only looking at the nearest car, and there's a new low FPS stabiliser which fades out the shake your frame rate can't show properly below 50 FPS, so it doesn't turn into a slow judder.\n\n## V1.0 Release Post\n\nGarry's Head Cam is my own take on a cockpit camera, and with it I wanted to add some features that no one else has really done before that I find useful, like automatic tuning of the camera per car, the ability to automatically look at other cars you choose in your sessions when they come into view, the choice of what mirror to look in when reversing and a few more.\n\n# Controls\n\n## Auto by Car Category\n\n{img:autobycategory.png}\n\nYou don't have to create new NeckFx presets yourself for every car anymore. The script reads the car's tags, class and year, works out whether it's Open-wheel, GT and Prototype, Touring, Rally or a road car, and sets the neck stiffness and HANS to suit.\n\nIt reads the year too, so anything before 2003 gets HANS turned off since the device didn't exist yet, and older cars get softer necks.\n\n## Head physics\n\n{img:headphysics.png}\n\n• Physics Force Multiplier is the main control for your head physics. It sets how much weight your head carries as the car throws you about. You can get two completely different cameras out of either end of it so it's worth a play around with before you touch anything else.\n• Neck Stiffness Scale controls how far your neck can move in each direction.\n• Back and Forth Movement is how far your head rocks forwards and back as you brake and get on the power. If that's the bit that bothers you, turn it down on its own and leave the rest of the physics where it is, 0 stops it completely.\n• Shake Intensity and Shake Speed are there if you want a greater sense of speed. The shake is gone at a standstill and levels off past 200mph so it never gets silly.\n• Gear Shift Jolt gives the camera a jolt when you change gears.\n• Impact Intensity controls how violent landings, kerb strikes and other impacts are.\n• HANS Device does one specific thing, it stiffens the forwards and backwards movement so heavy braking stops throwing your head forward, which is exactly what a HANS device does. It leaves everything else alone.\n\n## Head Gaze\n\n{img:glance.png}\n\nCorner Gaze glances your head towards the apex before you turn in, taken from the track ahead of you blended with your actual steering input. You have 3 settings to control it:\n\n• Glance Strength is the strength of the glance.\n• Gaze Lookahead is how far up the road your eyes reach, in seconds.\n• Inside Lean leans your head a little into the corner so you get a look past the pillar rather than into it.\n\nSlide Gaze takes over when the back steps out and keeps your eyes looking down the road through a drift rather than looking wherever the nose happens to be pointing.\n\n## Car Tracking\n\n{img:cartrackingexpanded.png}\n\nUnder Advanced there's Car Tracking, which turns your head to watch cars near you when they come into view.\n\nTracking Strength, Tracking Max Angle and Tracking Max Distance set how big a glance you give them, how far round and how far away it bothers with, and you can tick specific cars from a grid of the field if you only want to watch certain people. A slide always takes priority over it.\n\nTracking Smoothness sets how lazily your head moves as it picks a car up or swaps between them.\n\nHovering a card in that grid outlines the real car in-game so you can see who you're actually choosing to track when there's a pack of similar cars around you.\n\nThere's also a choice for what happens when a car you've ticked leaves your view, either it moves on to whoever else is around, or it waits for that one to come back.\n\n## Reverse Look\n\n{img:mirrorlookexpanded.png}\n\nReverse Look turns your head the moment you select reverse, to the rear-view mirror or either wing mirror, whichever you pick. If your car has real mirrors the camera finds it and aims at where it actually is on that car rather than at a fixed angle.\n\n{img:vrtoggle.png}\n\nThere's also Disable in VR which is on by default.
