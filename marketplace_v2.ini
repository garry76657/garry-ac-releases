[Mod_4]
NAME=Garry's Chaser Camera
TYPE=chaser_script
AUTHOR=Garry Roberts
SHORT_DESC=A cinematic chaser camera that reads the surface you're on and leans into the corners.
DESCRIPTION=Garry's Chaser Camera is a cinematic and customisable chaser camera. By default the camera is very arcade-y but that can easily be changed by dialling it in to your liking. I also find the camera is a lot smoother and more fluid than other cameras, and more immersive as the surface you're on changes the response so grass, kerbs and gravel all feel different from tarmac. It also leans into braking and cornering, reads the camber and gradient of the road so banking doesn't throw it off, and kicks over crests and dips.\n\n# Controls\n\n{img:image1.png}\n\nThe camera comes with a few settings for you to dial it in in game in the chaser cam app, like:\n\n## Feel\n\n• Physics Force Multiplier is how much it reacts to cornering, braking and bumps.\n• Inertia Switch Swiftness is how quickly it catches up when the load reverses, through a chicane or lifting off onto the brakes.\n• Camera Stiffness is the base feel everything else builds on, how tightly the rig is tied to the car.\n• Shake Intensity is the buzz that comes into the shot once you're up around 85mph, building the faster you go from there.\n• Slide Amount is how far the camera drifts out to the side in a slide so you can see the angle you're holding.\n\n## Field of View\n\n• Base FOV is your field of view before any speed effects.\n• Dynamic FOV widens the view as you gain speed and eases it back as you slow down.\n• Dynamic FOV Gain sets how much the FOV increases at speed.
