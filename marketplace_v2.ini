DESCRIPTION=Garry's Vanilla+ Skydomes is a realistic replacement for the default Pure skydomes. It's a set of 40 skydomes calibrated for both Pure Gamma and Pure LCS, and they work with any PP-Filter, though I made them mainly for GarryReal.\n\nThe set covers the 6 cloud weathers from midday through to night:\n\n1. Clear has 5 skies.\n2. Few Clouds has 9 skies.\n3. Scattered Clouds has 8 skies.\n4. Broken Clouds has 7 skies.\n5. Overcast has 5 skies.\n6. Windy has 6 skies.\n\n## Using them with Garry's Skydome App\n\nThe set works with Garry's Skydome App V0.11. Once it's installed the set shows up on the Home tab with the rest of your skydome sets, and all 40 skies can be used in your own presets in the preset editor, mixed in with skies from any other set you have.\n\nThe Skydome App also checks the set for updates, so if I put out a new version you'll get told about it in the app.\n\n## Using them without the app\n\nIf you don't use the Skydome App, open the Pure Config app in game, go to the Clouds tab and select Garrys-Vanilla+-Skydomes.\n\n{img:img01.webp}
