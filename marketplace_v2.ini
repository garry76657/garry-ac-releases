NAME=GarryReal
TYPE=ppfilter
AUTHOR=Garry Roberts
SHORT_DESC=An advanced Pure PP-Filter built around realism, with built in looks if you just want to drive and the tools to turn it into whatever filter you want if you don't.
DESCRIPTION=Press Get it to open GarryReal V2.0 on my Patreon.\n\nIt's been 10 months since the last GarryReal release, and in that time I've made GarryReal into something truly different from any other PP-Filter. I won't take this long to publish any more mods in the future as I've finally built the foundations for my ecosystem so from here on you can expect multiple releases across different mods every month.\n\nGarryReal V2.0 is an advanced Pure PP-Filter with a focus on realism, ease of use and customisation. I wanted a filter anyone can use to whatever extent they want. That means you don't have to spend hours dialling it in if you don't want to as there are built in presets and you can download other people's presets directly in the app. Or at the other extreme, you can turn GarryReal into whatever filter you want. I give you advanced tools and access to things like every internal value the filter sets, which you can modify with logic you create using graphs, and even the ability to build your own Pure PP-Filter with no code at all, a level of control no filter has ever given you before.\n\nIt's also the flagship filter for Garry's PPFilter App, so everything you're about to read is a showcase of what is possible because of my app. The app itself has its own post detailing what it does, this one is just for the filter.\n\nGarryReal comes in two versions, one for Pure LCS and one for Pure Gamma. Personally I think the Gamma version looks the best of the two, but most of the filter is identical in both, and section 10 covers what differs.\n\nThe filter is laid out over 9 tabs and I go through them in order in this post.\n\n## 1. Info Tab\n\n{img:img01.webp}\n\nThe Info tab is your starting point and holds the built in looks: GR Spec (the default), Kinema (a cinematic look with soft film emulation), Dreamy (soft and hazy with lifted shadows) and Balanced (LCS only, made for gameplay with weaker sunlight and shadows and brighter nights).\n\nEach look has a showcase image, and the time of day buttons flick it between midday, sunset and night so you see what the preset looks like in each condition. Hold the Preview button and the whole filter actually switches to that look in-game for as long as you hold it, let go and your own settings come straight back. The Compare button splits the showcase into two looks side by side so you can pick between them, and Apply loads the look. Kinema and Dreamy use the Garryfx spice effect which is included in the download.\n\nThere's also a Prioritise Performance toggle switch that turns off cockpit ambient and keeps the godrays screen space if you need the frames, plus my Patreon, Discord and YouTube links and a link to the video guide once it's out.\n\nThe tab also holds the filter tutorial, which walks through every tab of the filter step by step, highlighting each card as it explains it, with chapter buttons so you can jump straight to the part you care about. The Builder has its own separate walkthrough on top of it.\n\n## 2. Tonemapping Tab\n\nTonemapping compresses the wide range of colour the game renders down into the range your monitor can actually display which means it's the base of the whole look.\n\n{img:img02.webp}\n\nThe curve card lets you pick between 4 built in curves: GarryLume, GarrySpectra, GT Sport and GT7. Below that you get a bunch of cards: Quantization adds a colour banding effect, Exposure handles the curve's brightness calibration, and Blacks & Linearisation sets how dark the blacks sit, with linearise controls that straighten the bottom of the curve so blacks run flat instead of rolling off. Inside it sits Garry's Cockpit Adjustment, a separate black lift for the cockpit and the outside views, so the interior can stay readable without lifting the scene when you aren't in the cockpit.\n\nThe Colour Effects card holds the controls for the colour work layered on top of the tonemapping. The controls you get include sliders for colour realism, blue shift, vibrance and the taillight grading. Highlight warmth is a new addition which swings hot red highlights towards orange.\n\n{img:img03.webp}\n\n### Day & Night Adjustments\n\nNormally a control uses one value around the clock. The Day & Night Adjustments panel on this tab lets the tonemapping controls hold two values instead, one for day and one for night, and the filter blends between them at dawn and dusk.\n\n{img:img04.webp}\n\n### Developer Profiles\n\nTurn Developer Profiles on and the curve picker grows a + New Custom Curve entry. A custom curve opens the curve editor, which exposes the raw shader parameters my own curves are built from. Custom curves can be renamed, duplicated and deleted, and they sit in the picker alongside the built in ones. Developer profiles (here and on the other tabs) are saved outside presets, so the ones you author are a library every preset can point at.\n\n## 3. Colour Tab\n\n{img:img05.webp}\n\nThe Colour tab is where you can do any additional colour grading, with separate profiles for day and night. There are 10 built in profiles: Neutral, GR Colour, Kinema, Filmic +, Warm, Warm Lite, Kodak 2383, Muted, Velora and NFS.\n\n### The LUT Picker\n\n{img:img06.webp}\n\nThe LUT picker is its own side window. It lists every LUT in your color grading folder (.cube and .png both work) and bakes a live preview of each one onto reference shots you can flick between, so you see what a LUT actually does to the game before you apply it. GarryKodak2383 comes with the filter as the default colour grading LUT.\n\n### The Colour Picker\n\n{img:img07.webp}\n\nEvery colour swatch in the editor opens the colour picker window. You can drag the values to scrub them (hold shift for fine control) or click and type them in, and the last 8 colours you've set are kept as swatches to switch back to colours you have set before easily.\n\n## 4. Fog Tab\n\n{img:img08.webp}\n\nGarryFog is mostly the same as the previous version, just with fixes and improvements to the rain fog and the LCS fog.\n\n## 5. Lighting Tab\n\nThe Lighting tab is now split into Light, Reflections and World subtabs along the top.\n\n### Light\n\nThe old daylighting presets have been removed and have been replaced with new ones. GR Spec Lighting gives you a brighter sun with a bigger gap between what's lit and what's in shade while Balanced sits the two closer together. The balanced preset is only available in the LCS version.\n\nThe Tunnels card holds the control for the Tunnel Blowout strength.\n\nThe Advanced Ambient System swaps Pure's flat ambient for one I build from several bounces (the sky, the underside of cloud, city glow at night), and you can control how strong the bounces are, how deep the occlusion sits in corners and how dark nights can get.\n\n### Cockpit Ambient\n\n{img:img09.webp}\n\nCockpit Ambient lifts the dark interior surfaces to keep your dash and wheel visible without touching the scene outside. On LCS you can pick between two systems: Buffer-based which detects mirrors, screens and bright highlights so the fill isn't applied to them, with quality presets and an optional second detection pass for small or distant mirrors. Shadow-based (the Gamma system, also selectable on LCS) shapes the fill with an edge softness control and a directional lift for surfaces that face up like the dash top and seats. Both also have a glass pass, which adds a subtle realistic green tint to the windscreen and side glass.\n\n### Reflections\n\n{img:img10.webp}\n\nReflections now are their own tab and you now have access to the CPL controls, which set how glass and paint reflect. It also has the same two cards as Tonemapping: Day & Night Adjustments lets the preset and the CPL controls hold separate day and night values, and Developer Profiles lets you make your own reflection presets that sit alongside the built in ones.\n\n### World\n\nThe World sub-tab holds the sky overrides (LCS only, one toggle blends Pure Gamma's sky colours into the LCS sky, the other takes over the sun disk's size, brightness and colour), the stars (how many, whether they show in daylight, and a colour override), rainbows (realistic, constant or off), and the godrays.\n\n### Godrays\n\nThe Godrays card switches between screen space godrays and my custom volumetric ones. Screen space godrays are the old ones every filter has, and they vanish as soon as the sun is off screen. Volumetric godrays don't do this, and they look much better than their screen space counterparts.\n\nVolumetric Godrays\n\n{img:img11.webp}\n\nScreen Space Godrays\n\n{img:img12.webp}\n\nThe card also has a Sun Colour button with a gradient strip next to it. That opens a colour curve where you set the ray colour across the sun's height in the sky, so the rays can change colour on their own as the sun rises and sets. It tints both godray modes.\n\n## 6. Exposure Tab\n\nThe Exposure tab gives you the three exposure modes as cards: Auto-Exposure, Fixed Exposure, and Night-Only Fixed, auto by day and a fixed value after dark. A live status panel shows the exact value exposure has at any moment.\n\nAuto exposure comes in two styles. Garry's Auto-Exposure which keeps the brightness steady and smooth so it doesn't jump about as you drive, and Camera-like acts more like a real camera, it reacts quicker and shifts further as the light changes.\n\nThe Virtual Mirror card holds a brightness multiplier for the virtual mirror so you can match it to the scene if it is ever wrong (needs Pure 3.22 or newer, the slider tells you if it can't find the shader).\n\n## 7. Glare Tab\n\n{img:img13.webp}\n\n{img:img14.webp}\n\nGlare has been reworked to look better in LCS and Gamma and it has separate Day and Night cards permanently.\n\nEach card lets you pick from 8 built in profiles: GT7, Anamorphic, Lens Flare, Isotoxal, Garry Spec, Eyelike, Dashcam Bloomy and Dashcam Streaky (NEW), then three multipliers per side for the glare threshold, its overall strength and the bloom around it.\n\nDeveloper Profiles here lets you build your own glare profiles from scratch in a full editor, and the ones you make show up in both the day and night pickers.\n\n## 8. Internal Tab\n\nEverything GarryReal sets internally is laid out here in one place, grouped into Light, Sky, Fog, Clouds, Colour Management and Glare. The built in logic is code so you can't edit it, but you can stack your own logic on top of any value, and anything you add can be bypassed, turned off or removed again.\n\n{img:img15.webp}\n\nThe switch up top picks what you're editing. Engine Logic is the filter's internal engine settings, the deep values the rest of the app drives for you. UI swaps the list to the filter's own visible controls, the sliders and toggles on the other tabs, and you can modify those the exact same way, so a user facing control can react to the scene too.\n\nEvery setting can take modifiers which are pieces of logic stacked on the value, applied top to bottom, and you can drag them into order. The types you get are:\n\n{img:img16.webp}\n\nMultiply & Offset, where Multiply scales the setting and Offset shifts it, with an editor that sets the bounds.\n\n{img:img17.webp}\n\nLUT Multiplier and LUT Offset which reshape the value over a live condition with a curve you draw, drag points and the value follows the curve as the condition moves.\n\n{img:img18.webp}\n\nColour modifiers do the same for colour settings, you set a gradient across the condition so a tint can shift from day to night on its own.\n\n{img:img19.webp}\n\nCondition Switch flips a value when a condition crosses a threshold, and Condition Select picks a value per state for stepped conditions like the weather type.\n\nAny modifier can also have a gate, which fades it in and out with a condition, so a modifier can exist only at night, only in fog, only above a certain speed.\n\nThe conditions list is what makes this unique, there are over 20 live values like sun elevation, cloud coverage, rain, camera speed, RPM and G-force. This means you can turn GarryReal into whatever filter you want.\n\n{img:img20.webp}\n\nOnce the Internal tab is driving a control, the control says so on its own tab, sliders move on their own and toggles get a Controlled by Internal Tab pill, so you can always see when the Internal tab is controlling something.\n\n{img:img21.webp}\n\nThere's also an Import Pure Config button, which pulls your saved Pure config or PP settings in as modifiers, so a look you've already dialled in over in Pure doesn't have to be rebuilt here by hand.\n\n## 9. The Builder\n\nThe Builder is its own PP-Filter that you author from scratch using a node graph. It doesn't inherit anything from GarryReal's other tabs as it's a completely separate filter you build yourself, and while it's enabled it owns the whole engine which means GarryReal's tabs stop applying until you turn it back off.\n\nEach Builder filter is a project with its own name, author, version, description and accent colour.\n\nYou connect nodes left to right. Input nodes produce a value, from a fixed number, one of your own UI controls, a live condition, or an engine parameter's own base value. Modifier nodes reshape it. Output nodes write the result into an engine parameter every frame, and any parameter you don't wire just keeps its engine default. Every node shows its live value at its port, so you can watch what's flowing through the graph in real time.\n\nThe node palette is a searchable side window with a live preview of every node type, plus ready made logic presets like Sun Fade and Speed Ramp, and the saved groups you've built yourself. The main nodes you'll use:\n\n1. Condition Curve lets you pick any condition and draw a curve over its range, with a live scrubber showing where the condition currently sits.\n2. Function is the all-purpose maths node, a base input plus a chain of operations you extend with whichever operators you want, each with its own input port.\n3. LUT is a lookup table you fill in by hand, with interpolation between rows.\n4. Curve reshapes whatever you wire into it, and the axis shows the input's real range so you place points in real units.\n5. Logic Groups are containers that gate the Outputs inside them, they nest, they collapse down to a single card when you're not editing them, and when two Groups write the same parameter the higher priority one wins.\n6. Profile nodes let you bind a glare, colour, tonemap or exposure preset to a graph signal, with parameter logic that exposes single fields of the preset as their own input ports.\n\nThe Tonemapping panel lets you pick the tonemap method (AGX, Uchimura, Reinhard and so on) and edit its parameters. The Exposure panel does the same for exposure, with modes mirroring the real Pure paths. Both save presets to the project and apply through Profile nodes.\n\nThe UI Elements window is where you make the user facing side of your filter, your own tabs, cards, sliders, toggles, radios and colour pickers, laid out in a structure tree with live miniatures of every control, and you can drag to reorder or nest them. Bind any of them into the graph through an Input node and that's your filter's interface, whoever uses your filter only sees the controls you made, not the graph.\n\nOn top of that there's Find, which dims every node that doesn't match your search (it searches labels, conditions and bound UI elements), Isolate, which shows only the selected node and what's wired to it, multi-select, duplicate, and a group library that lets you save any Group and drop it into other projects. The Builder also has its own step by step walkthrough, separate from the main tutorial.\n\n## 10. What Differs Between the LCS and Gamma Versions\n\nThe two versions are the same for almost everything above, the Tonemapping, Colour, Glare, Internal and Builder tabs are the same in both, with the values tuned per version because the two Pures handle lighting differently. Your presets and developer profiles are kept separately per version too. The actual differences:\n\n1. Built-In Looks (Presets): LCS has 4 (GR Spec, Kinema, Dreamy, Balanced), Gamma has 3, no Balanced, and no Balanced day lighting preset either.\n2. Cockpit Ambient: LCS picks between the Buffer-based and Shadow-based systems, Gamma runs Shadow-based.\n3. Sky Overrides (the Gamma sky blend and the sun disk override) are LCS only, Gamma doesn't need them.\n4. Exposure: LCS has separate day and night targets, sensitivities and limits plus the advanced CBE section. Gamma keeps it to one target.
