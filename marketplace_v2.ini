SHORT_DESC=A Spice effect that makes the game look like it was recorded on a real dashcam.
DESCRIPTION=Press Get it to open GarryDashcam V1.0 on my Patreon.\n\nGarryDashcam is what I started my Patreon on. It used to be a ReShade preset and it's now been rebuilt from scratch as a Spice effect for Garry's PPFilter App, with lens dirt, glare, 50 film LUTs and effects that simulate the way a real dashcam records, like the resolution, frame rate, rolling shutter, compression and even the sound of the mic.\n\nIt runs through the Spice tab in Garry's PPFilter App V0.12, which is included in the download along with Garry's App Hub V0.12, and it works with any filter. The easiest way to enable it is by enabling the built in Garry's Dashcam setup, which sets everything up for you in one click. It doesn't install anything though.\n\nThere are 3 sections and I go through them in order in this post. The first is the setup, the second is the Spice effect and the third is the Dashcam cockpit camera.\n\n## 1. Garry's Dashcam Setup\n\nThe setup is in the App Hub's Discover tab and sets up 3 things:\n\n1. The GarryDashcam Spice effect in the PPFilter App.\n\n2. Some GarryReal settings, which are the Dashcam Streaky glare for the day and Dashcam Bloomy for the night. These are added on top of your current GarryReal settings so the rest of your style stays the same.\n\n3. The Dashcam NeckFx camera in the NeckFx App, which is a rigid mount camera that shakes with the road, kerbs and engine like a real dashcam would.\n\nYour current settings are saved before the setup is applied, so if you don't like it you can put them back from the status pill.\n\n## 2. The Spice Effect\n\nThe Spice effect has 8 tabs down the left of the card and every effect in them has its own switch.\n\n### General\n\nThis tab has the overall strength and interior view only switch, which only shows the effect when you're inside the car, so your outside cameras stay clean. It also has the stamp, which puts your speed, the date and time and your GPS coordinates in the corner like a real dashcam, in km/h or mph. The stamp can be drawn cleanly over the game or recorded into the footage so it gets the same compression as everything else, and it even has GPS lag and an event lock which marks the clip as locked when you have a big enough hit. The g-sensor setting decides how hard that hit has to be.\n\n### Colour Grade\n\nThis tab has the 50 film LUTs, and you can set how much of each LUT's colour and brightness comes through separately. It also has red and orange lift, auto contrast, muted colours and clarity, which can be kept off the brightest parts of the picture like the sky.\n\n### Tone & Exposure\n\nThe camera exposure reacts to the light like a real camera does instead of your eyes, so it takes a moment to settle when you drive out of a tunnel or into shade, and you can set how long it takes to settle when it gets brighter and when it gets darker separately. White balance shifts when the light changes enough, and sensor clipping sets how bright a colour can get before it blows out to white, while highlight intensity keeps the sun and headlights bright.\n\n### Bloom\n\nThis tab has sensor haze, a wide glow that pulls itself back in bright scenes, and lens dirt that lights up around bright lights like the sun and headlights, with a second layer of dirt that adds a faint haze over the whole lens.\n\n### Depth & Focus\n\nThis tab has a lens focus with auto or manual focus, and highlight bokeh, which turns lights that are out of focus into bright discs, with a choice of bokeh shape.\n\n### Video Texture\n\nThis tab adds sensor noise to the picture.\n\n### Lens\n\nThis tab has barrel distortion, which bends the corners of the picture more than the middle, vignette, colour fringing and corner softness.\n\n### Recording\n\nThis tab is what makes it look like real recorded footage. You can set the resolution from 480p up to 2160p with soft or blocky upscaling, the frame rate, the shutter smear which blends each frame into the one before, rolling shutter which sets how long the sensor takes to read each frame, and motion blur.\n\nCompression breaks the picture into blocks, smears the colour, adds fizzy noise around hard edges and gets blockier when the whole picture is moving, with the detail popping back in on every keyframe. Glitches can drop or double frames and freeze the picture for a moment when it starts a new file.\n\nNight mode kicks in when it gets dark and drops the frame rate, adds extra grain and leaves smeared trails behind anything moving. Audio cuts the highs and lows off the car's sound and distorts it when it gets loud, so it sounds like it was recorded on a dashcam mic.\n\n## 3. Garry's Dashcam NeckFx\n\nThe Dashcam NeckFx is a cockpit camera script for Garry's NeckFx App which makes your view move like a real dashcam stuck to the windscreen instead of a driver's head. It's built on the same physics as my Head Cam, but it's simulated as a small camera on an adhesive mount, so it doesn't move around as much as a head, but it picks up the vibrations that go through the car.\n\nThe camera shakes with the bumps, the road surface and the kerbs, buzzes with the engine, jolts when you change gear, twitches when the wipers pass, and gets pushed around by the wind at high speed and by any big hits.\n\n### Settings\n\nIt has 3 settings which you can change in the NeckFx App's Scripts tab or in CM: shake amount, road feel, which sets how much the bumps, road surface and kerbs affect the camera, and gear shift jolt. It also pauses itself in VR by default, which you can turn off.
